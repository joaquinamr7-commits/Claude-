<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:#f7f7f7; font-family:"Inter","Inter Display",sans-serif; color:#111;
    background: radial-gradient(ellipse at 20% 10%, #ffffff 0%, #f3f3f3 60%, #ececec 100%); }
  .wrap { padding:110px 80px 0 80px; height:100%; display:flex; flex-direction:column; }
  .head { display:flex; align-items:center; gap:34px; }
  .ring { width:210px; height:210px; border-radius:50%; padding:7px;
    background: conic-gradient(from 200deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5, #feda75); }
  .ring-inner { width:100%; height:100%; border-radius:50%; background:#fff; padding:6px; }
  .avatar { width:100%; height:100%; border-radius:50%; overflow:hidden; position:relative; background:#333; }
  .avatar img { position:absolute; width:560px; left:-204px; top:-150px; }
  .name { font-size:56px; font-weight:800; letter-spacing:-1.2px; display:flex; align-items:center; gap:14px; }
  .badge { width:50px; height:50px; }
  .handle { font-size:42px; color:#8a8a8a; font-weight:500; margin-top:6px; letter-spacing:-0.5px; }
  .body { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding-bottom:80px; }
  .txt { font-size:62px; font-weight:700; line-height:1.14; letter-spacing:-1.8px; }
  .txt p + p { margin-top:44px; }
  .big { margin-top:80px; font-family:"Inter Display","Inter",sans-serif; font-size:118px; font-weight:900; line-height:1.0; letter-spacing:-3px; }
  .emoji { font-family:"Noto Color Emoji"; letter-spacing:0; }
</style></head>
<body><div class="wrap">
  <div class="head">
    <div class="ring"><div class="ring-inner"><div class="avatar"><img src="perfil.jpg"></div></div></div>
    <div>
      <div class="name">Joaco Bulking
        <svg class="badge" viewBox="0 0 24 24"><path fill="#3897f0" d="M12 1l2.6 2.1 3.3-.4 1.1 3.1 3 1.6-.9 3.2.9 3.2-3 1.6-1.1 3.1-3.3-.4L12 23l-2.6-2.1-3.3.4-1.1-3.1-3-1.6.9-3.2-.9-3.2 3-1.6 1.1-3.1 3.3.4z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.3l3 3 5.8-6.2"/></svg>
      </div>
      <div class="handle">@joacobulking</div>
    </div>
  </div>
  <div class="body">
    <div class="txt">
      <p>Quedan 60 días para que termine el año.</p>
      <p>Algunos llegaron a noviembre cumpliendo lo que se propusieron. <span class="emoji">🚀</span></p>
      <p>Otros se quedaron en marzo. <span class="emoji">🥹</span></p>
    </div>
    <div class="big">TODAVÍA ESTÁS<br>A TIEMPO <span class="emoji">🏗️</span></div>
  </div>
</div></body></html>
