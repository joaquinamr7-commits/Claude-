<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:#fff; font-family:"Inter",sans-serif; color:#111;
    display:flex; align-items:center; justify-content:center; }
  .card { width:900px; margin-top:-60px; }
  .head { display:flex; align-items:center; gap:26px; margin-left:16px; }
  .avatar { width:150px; height:150px; border-radius:50%; overflow:hidden; position:relative; background:#333; border:2px solid #eee; }
  .avatar img { position:absolute; width:100%; left:0; top:0; }
  .name { font-size:42px; font-weight:800; letter-spacing:-0.8px; display:flex; align-items:center; gap:10px; }
  .badge { width:38px; height:38px; }
  .handle { font-size:38px; color:#222; font-weight:400; margin-top:2px; letter-spacing:-0.3px; }
  .txt { margin-top:70px; font-size:47px; font-weight:400; line-height:1.38; letter-spacing:-0.4px; }
  .txt b { font-weight:800; }
</style></head>
<body><div class="card">
  <div class="head">
    <div class="avatar"><img src="perfil.jpg"></div>
    <div>
      <div class="name">Joaco Bulking
        <svg class="badge" viewBox="0 0 24 24"><path fill="#3897f0" d="M12 1l2.6 2.1 3.3-.4 1.1 3.1 3 1.6-.9 3.2.9 3.2-3 1.6-1.1 3.1-3.3-.4L12 23l-2.6-2.1-3.3.4-1.1-3.1-3-1.6.9-3.2-.9-3.2 3-1.6 1.1-3.1 3.3.4z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.3l3 3 5.8-6.2"/></svg>
      </div>
      <div class="handle">@joaco_bulking</div>
    </div>
  </div>
  <div class="txt">Antes de cortar los carbohidratos, corta con la gente que te <b>dispara el CORTISOL <span style="white-space:nowrap">por las nubes.</span></b></div>
</div></body></html>
